name: Build Infinity installers

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installer
        run: npm run build:win

      - name: Upload Windows artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Infinity-Windows-x64
          path: |
            artifacts/Infinity-Setup-*.exe
            artifacts/Infinity-Setup-*.blockmap
            artifacts/latest.yml

  macos:
    name: macOS Intel and Apple Silicon
    runs-on: macos-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build free ad-hoc signed macOS installers
        run: npm run build:mac

      - name: Verify macOS application signatures
        run: |
          codesign --verify --deep --strict --verbose=2 release/mac/Infinity.app
          codesign --verify --deep --strict --verbose=2 release/mac-arm64/Infinity.app
          codesign -dv --verbose=4 release/mac/Infinity.app 2>&1 | grep -q "Signature=adhoc"
          codesign -dv --verbose=4 release/mac-arm64/Infinity.app 2>&1 | grep -q "Signature=adhoc"

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Infinity-macOS
          path: |
            release/Infinity-*-mac-*.dmg
            release/Infinity-*-mac-*.zip
            release/Infinity-*-mac-*.blockmap
            release/latest-mac.yml

  release:
    name: Publish GitHub Release
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download installers
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: release-assets/*
          generate_release_notes: true
