name: Build Infinity installers

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installer
        run: npm run build:win

      - name: Upload Windows artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Infinity-Windows-x64
          path: |
            artifacts/Infinity-Setup-*.exe
            artifacts/Infinity-Setup-*.blockmap
            artifacts/latest.yml

  macos:
    name: macOS Intel and Apple Silicon
    runs-on: macos-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build free ad-hoc signed macOS installers
        run: npm run build:mac

      - name: Verify macOS application signatures
        run: |
          codesign --verify --deep --strict --verbose=2 release/mac/Infinity.app
          codesign --verify --deep --strict --verbose=2 release/mac-arm64/Infinity.app
          codesign -dv --verbose=4 release/mac/Infinity.app 2>&1 | grep -q "Signature=adhoc"
          codesign -dv --verbose=4 release/mac-arm64/Infinity.app 2>&1 | grep -q "Signature=adhoc"

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Infinity-macOS
          path: |
            release/Infinity-*-mac-*.dmg
            release/Infinity-*-mac-*.zip
            release/Infinity-*-mac-*.blockmap
            release/latest-mac.yml

  release:
    name: Publish GitHub Release
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download installers
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: release-assets/*
          generate_release_notes: true
